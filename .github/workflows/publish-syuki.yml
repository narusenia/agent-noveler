name: publish-syuki

# タグ syuki-v<版> を push すると、syuki を PyPI に出す（Trusted Publishing。トークンは使わない）
on:
  push:
    tags: ["syuki-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: packages/syuki
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: tag matches pyproject version
        run: test "syuki-v$(uv version --short)" = "$GITHUB_REF_NAME"
      - run: uv sync --extra ja && uv run pytest -q
      - run: uv build
      - run: uv publish
