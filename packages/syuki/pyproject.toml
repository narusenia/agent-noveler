[project]
name = "syuki"
version = "0.1.0"
description = "小説の執筆支援 CLI（台帳・引用・照合）"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
# 未登録語の照合だけが使う。無ければその照合を飛ばす
ja = ["sudachipy>=0.6", "sudachidict-core"]

[project.scripts]
syuki = "syuki.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/syuki"]
